name: Deploy Production

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:packages

      - name: Build web app
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: pnpm --filter @calorie-tracker/web build

      - name: Prepare deployment bundle
        run: |
          mkdir -p deploy-bundle/apps/web deploy-bundle/apps/api deploy-bundle/packages
          cp -r apps/web/dist deploy-bundle/apps/web/
          cp docker-compose.prod.yml .dockerignore deploy-bundle/
          cp -r deploy deploy-bundle/
          cp pnpm-lock.yaml pnpm-workspace.yaml package.json deploy-bundle/
          rsync -a --exclude node_modules --exclude dist packages/shared/ deploy-bundle/packages/shared/
          rsync -a --exclude node_modules --exclude dist packages/db/ deploy-bundle/packages/db/
          rsync -a --exclude node_modules --exclude dist apps/api/ deploy-bundle/apps/api/
          test -f deploy-bundle/apps/api/Dockerfile || {
            echo 'ERROR: apps/api/Dockerfile missing from deploy bundle'
            ls -la apps/api || true
            ls -la deploy-bundle/apps/api || true
            exit 1
          }

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'backups/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            deploy-bundle/ \
            "${VPS_USER}@${VPS_HOST}:/opt/calorie-tracker/"

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_TAG: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "cd /opt/calorie-tracker && \
             echo 'Deploying ${DEPLOY_TAG}' && \
             test -f .env || { echo 'ERROR: /opt/calorie-tracker/.env is missing. Create it from deploy/.env.production.example before deploying.'; exit 1; } && \
             test -f apps/api/Dockerfile || { echo 'ERROR: apps/api/Dockerfile is missing after sync.'; ls -la apps/api || true; exit 1; } && \
             docker compose -f docker-compose.prod.yml build api && \
             docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate && \
             docker compose -f docker-compose.prod.yml up -d && \
             docker image prune -f && \
             sudo nginx -t && sudo systemctl reload nginx"
