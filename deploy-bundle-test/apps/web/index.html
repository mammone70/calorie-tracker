    <script>

          localStorage.getItem('calorie-tracker-color-mode') ||
          localStorage.getItem('calorie-tracker-theme');
        var theme = localStorage.getItem('calorie-tracker-color-theme');
        var dark = mode !== 'light';
        var pink = theme === 'pink-galore';
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.classList.add('theme');
        document.documentElement.classList.toggle('theme-pink-galore', pink);

        if (meta) {
          if (pink) meta.setAttribute('content', dark ? '#1e1e1e' : '#fafafa');
          else meta.setAttribute('content', dark ? '#161616' : '#fafafa');
        }
      })();
    </script>
