# /etc/nginx/sites-available/mammonesoftware.org
#
# DNS A records -> VPS IP:
#   cal-count.mammonesoftware.org
#   api.cal-count.mammonesoftware.org
#
# TLS (after DNS propagates):
#   sudo certbot --nginx -d cal-count.mammonesoftware.org -d api.cal-count.mammonesoftware.org
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP: redirect to HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name mammonesoftware.org www.mammonesoftware.org
                cal-count.mammonesoftware.org api.cal-count.mammonesoftware.org;

    return 301 https://$host$request_uri;
}

# Redirect root domain to the app subdomain (optional)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name mammonesoftware.org www.mammonesoftware.org;

    ssl_certificate /etc/letsencrypt/live/mammonesoftware.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mammonesoftware.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://cal-count.mammonesoftware.org$request_uri;
}

# HTTPS: calorie-tracker web app
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name cal-count.mammonesoftware.org;

    # certbot creates one cert for both subdomains; path is usually the first -d name
    ssl_certificate /etc/letsencrypt/live/cal-count.mammonesoftware.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cal-count.mammonesoftware.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/calorie-tracker/apps/web/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS: calorie-tracker API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name api.cal-count.mammonesoftware.org;

    ssl_certificate /etc/letsencrypt/live/cal-count.mammonesoftware.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cal-count.mammonesoftware.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
