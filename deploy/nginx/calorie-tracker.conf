# Install on VPS:
#   sudo cp /opt/calorie-tracker/deploy/nginx/calorie-tracker.conf \
#     /etc/nginx/sites-available/calorie-tracker
#   sudo ln -sf /etc/nginx/sites-available/calorie-tracker /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d mammonesoftware.org   # skip if cert already exists
#   sudo nginx -t && sudo systemctl reload nginx
#
# If mammonesoftware.org already has a server block, merge these locations
# into that block instead of enabling a conflicting server_name.

server {
    listen 80;
    listen [::]:80;
    server_name mammonesoftware.org;

    # certbot adds HTTPS listen directives and redirects when you run:
    # sudo certbot --nginx -d mammonesoftware.org

    root /opt/calorie-tracker/apps/web/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
